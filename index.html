<!DOCTYPE html>
<html lang="en" data-theme="deep">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#0a0a0a" />
<title>Success Grid — Turn any goal into a plan</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8E%AF%3C/text%3E%3C/svg%3E" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<link rel="stylesheet" href="styles.css" />
</head>
<body>

<div id="onboarding" class="onb" hidden>
  <div class="onb-slides">

    <section class="onb-slide" data-slide="0">
      <div class="onb-art">
        <svg viewBox="0 0 400 400" class="onb-svg" aria-hidden="true">
          <defs>
            <radialGradient id="haloGrad">
              <stop offset="0%" stop-color="var(--accent)" stop-opacity=".35"/>
              <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
            </radialGradient>
          </defs>

          <g class="conns">
            <line class="conn" data-i="0" x1="240" y1="200" x2="340" y2="200"/>
            <line class="conn" data-i="1" x1="228" y1="228" x2="299" y2="299"/>
            <line class="conn" data-i="2" x1="200" y1="240" x2="200" y2="340"/>
            <line class="conn" data-i="3" x1="172" y1="228" x2="101" y2="299"/>
            <line class="conn" data-i="4" x1="160" y1="200" x2="60"  y2="200"/>
            <line class="conn" data-i="5" x1="172" y1="172" x2="101" y2="101"/>
            <line class="conn" data-i="6" x1="200" y1="160" x2="200" y2="60"/>
            <line class="conn" data-i="7" x1="228" y1="172" x2="299" y2="101"/>
          </g>

          <g class="dots">
            <circle class="dot" data-i="0" cx="340" cy="200" r="14"/>
            <circle class="dot" data-i="1" cx="299" cy="299" r="14"/>
            <circle class="dot" data-i="2" cx="200" cy="340" r="14"/>
            <circle class="dot" data-i="3" cx="101" cy="299" r="14"/>
            <circle class="dot" data-i="4" cx="60"  cy="200" r="14"/>
            <circle class="dot" data-i="5" cx="101" cy="101" r="14"/>
            <circle class="dot" data-i="6" cx="200" cy="60"  r="14"/>
            <circle class="dot" data-i="7" cx="299" cy="101" r="14"/>
          </g>

          <circle class="target-halo" cx="200" cy="200" r="90" fill="url(#haloGrad)"/>
          <circle class="target-ring" cx="200" cy="200" r="40"/>
          <circle class="target-core" cx="200" cy="200" r="18"/>
        </svg>
      </div>
      <h1>Success Grid</h1>
      <p class="onb-caption" id="onbCaption">One goal at the center.</p>
      <div class="onb-dots"><span class="on"></span><span></span><span></span></div>
      <button class="btn primary block" data-onb="next">Get started</button>
    </section>

    <section class="onb-slide" data-slide="1" hidden>
      <h1>What should we call you?</h1>
      <p class="muted">Just so we can say hi the next time you open this.</p>
      <input id="onbName" class="inp" placeholder="Your name" autocomplete="given-name" />
      <div class="onb-dots"><span></span><span class="on"></span><span></span></div>
      <button class="btn primary block" data-onb="next">Continue</button>
    </section>

    <section class="onb-slide" data-slide="2" hidden>
      <h1>What's your main goal?</h1>
      <p class="muted">One sentence. You can change it later.</p>
      <textarea id="onbGoal" class="inp" rows="3"
        placeholder="e.g. Land a paid data analyst internship by mid-2027"></textarea>

      <div class="onb-mode">
        <label class="fl">Goal type</label>
        <div class="seg" id="onbType">
          <button class="on" data-type="career">Career</button>
          <button data-type="fitness">Fitness</button>
          <button data-type="other">Other</button>
        </div>
      </div>

      <div class="onb-dots"><span></span><span></span><span class="on"></span></div>
      <button class="btn primary block" data-onb="build-ai">Build with AI</button>
      <button class="btn block ghost" data-onb="build-blank">Start from blank</button>
    </section>

  </div>
</div>

<div id="app" hidden>
  <header class="topbar">
    <div class="brand">
      <div class="logo" id="logoEmoji">🎯</div>
      <h1 id="appTitle">Success Grid</h1>
    </div>
    <div class="topbar-actions">
      <button class="btn icon" id="menuBtn" title="More" aria-label="More">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg>
      </button>
    </div>
  </header>

  <main id="view"></main>

  <nav class="tabbar" id="tabbar">
    <button class="tab" data-tab="today">
      <span class="ic"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg></span>
      <span>Today</span>
    </button>
    <button class="tab" data-tab="grid">
      <span class="ic"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></span>
      <span>Grid</span>
    </button>
    <button class="tab" data-tab="plan">
      <span class="ic"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4.5" width="18" height="16" rx="2"/><path d="M3 9.5h18M8 2.5v4M16 2.5v4"/></svg></span>
      <span>Plan</span>
    </button>
    <button class="tab" data-tab="track">
      <span class="ic"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M22 12h-4l-3 8L9 4l-3 8H2"/></svg></span>
      <span>Track</span>
    </button>
    <button class="tab" data-tab="more">
      <span class="ic"><svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="5.5" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="18.5" cy="12" r="1.6" fill="currentColor" stroke="none"/></svg></span>
      <span>More</span>
    </button>
  </nav>
</div>

<div id="modalRoot" class="modal-root" hidden></div>
<div class="toast" id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
